# The meeting bot on an Oracle Cloud Always Free VM (Ampere A1, arm64).
# The website runs on Vercel and the database on Supabase; see README.md.
#
# Run from this folder on the server:
#   docker compose up -d --build                    start / update the bot
#   docker compose --profile login run --rm --service-ports login   one-time Google sign-in for the bot
x-app: &app
  env_file: ../../.env
  image: notetaker-worker:local
  build:
    context: ../..
    dockerfile: apps/worker/Dockerfile
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  # Creates/updates the database tables on every `up`, then exits.
  migrate:
    <<: *app
    working_dir: /app/packages/db
    entrypoint: ["pnpm", "exec", "drizzle-kit", "push", "--force"]

  worker:
    <<: *app
    restart: always
    environment:
      WORKER_ID: oracle-1
      TZ: Asia/Kolkata # recording file names use local time
    volumes:
      # Signed-in Google profile and not-yet-uploaded recordings survive restarts and updates.
      - bot-data:/data
    shm_size: 1gb # Chrome needs more shared memory than Docker's 64 MB default
    depends_on:
      migrate: { condition: service_completed_successfully }

  # One-time: opens Chrome on a virtual screen you can see over VNC, to sign the bot in.
  login:
    <<: *app
    profiles: [login]
    environment:
      VNC: "1"
    volumes:
      - bot-data:/data
    shm_size: 1gb
    ports:
      - "127.0.0.1:5900:5900" # server loopback only; reach it with an SSH tunnel
    command: ["sh", "-c", "./node_modules/.bin/tsx src/login.ts $$BOT_EMAIL"]

volumes:
  bot-data:
